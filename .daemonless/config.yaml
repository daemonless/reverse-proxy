# dbuild configuration file
# Full reference: https://github.com/daemonless/dbuild

build:
  architectures:
    - amd64
    - aarch64
  variants:
    # :latest is held at 0.2.0 by hand until 0.3.0 is called stable; then
    # put the latest variant back (default) above beta.
    - tag: beta
      containerfile: Containerfile
      default: true
      args:
        RP_CHANNEL: beta
        UPSTREAM_URL: "https://api.github.com/repos/daemonless/reverse-proxy-src/releases"
        UPSTREAM_JQ: '[.[] | select(.prerelease)][0].tag_name | ltrimstr("v")'
      tag_desc: "**Beta** -- the newest reverse-proxy-src pre-release. For testing; back up /config first."

cit:
  mode: health
  port: 8443
  https: true
  health: /healthz
  # The admin logs this once the full Caddy config is live.
  ready: "\\[admin\\] Caddy configuration loaded"
  # Caddy runs as root by design (binds 80/443); the admin runs as bsd.
  puid: false
