name: Build FreeBSD Container

on:
  push:
    branches: [main]
    paths-ignore: ['*.md', 'LICENSE', '.gitignore']
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  build:
    # Trial of dbuild#feat/linux-images: back to @main (and no dbuild_ref)
    # once that is merged.
    uses: daemonless/dbuild/.github/workflows/daemonless-build.yaml@feat/linux-images
    with:
      image_name: reverse-proxy
      dbuild_ref: feat/linux-images
      linux: true
    secrets: inherit
